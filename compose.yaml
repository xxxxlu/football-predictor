services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: football_predictor
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_predictor"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - football_predictor_pgdata:/var/lib/postgresql

volumes:
  football_predictor_pgdata:
