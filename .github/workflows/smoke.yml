name: smoke

# Post-deploy smoke test against a running environment. Render triggers deploys
# on its own (autoDeployTrigger: checksPass), so this is invoked manually after a
# deploy completes, or chained from another workflow via workflow_call. It runs
# only anonymous GETs and never mutates state.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL of the deployed web service (e.g. https://football-predictor-web.onrender.com)"
        required: true
        type: string
  workflow_call:
    inputs:
      base_url:
        description: "Base URL of the deployed web service"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Smoke test the deployed service
        # The input reaches the script via env, never interpolated into the shell line
        # (a crafted base_url could otherwise inject commands into the runner).
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node scripts/smoke-test.mjs "$BASE_URL"
