name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football_ci
          POSTGRES_DB: football_predictor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_predictor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_VERSION: ci
      LOG_LEVEL: info
      RULES_VERSION: phase-1-ci
      DATABASE_URL: postgresql://football:football_ci@127.0.0.1:5432/football_predictor_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify workspace and deployment blueprint structure
        run: pnpm verify:workspace
      - name: Migration smoke and idempotency
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm --filter @football-predictor/db exec node --input-type=module -e '
            import { readdir } from "node:fs/promises";
            import postgres from "postgres";
            const expected = (await readdir("migrations")).filter((name) => name.endsWith(".sql")).length;
            const sql = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
            const [{ count }] = await sql`SELECT count(*)::int AS count FROM public.app_schema_migrations`;
            await sql.end();
            if (count !== expected) throw new Error(`migration smoke mismatch: expected ${expected}, got ${count}`);
            console.log(`migration smoke passed: ${count} migrations, second run idempotent`);
          '
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Story 7.5 gates G1/G2/G5: main-journey Playwright E2E + axe a11y scan + perf smoke.
    # BLOCKING release gate — verified green in CI (PR #1 run 3, 2026-07-22: 8 passed / 7 skipped).
    # The 4 authenticated journeys remain test.fixme (production Secure-cookie session blocker) and skip
    # automatically without reporting false green; un-fixme them once that blocker is addressed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football_ci
          POSTGRES_DB: football_predictor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_predictor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_VERSION: ci
      LOG_LEVEL: info
      RULES_VERSION: phase-1-ci
      DATABASE_URL: postgresql://football:football_ci@127.0.0.1:5432/football_predictor_test
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Seed a super-admin for admin journeys (best-effort)
        run: pnpm db:seed:super-admins || echo "super-admin seed skipped; journey 5 may be limited"
      - name: Build packages, worker and web
        run: pnpm build
      - name: Install Playwright browser (chromium)
        run: pnpm --filter @football-predictor/web exec playwright install --with-deps chromium
      - name: Run main-journey E2E and axe accessibility scan
        run: pnpm --filter @football-predictor/web test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Performance smoke (non-blocking tripwire)
        # if: always() so a failing E2E build still produces perf-smoke output for diagnosis instead of
        # skipping it. The smoke itself stays non-blocking via `|| echo` (it is a loose tripwire, not a
        # NFR1 assertion); only the E2E + axe step above is the blocking gate.
        if: always()
        run: |
          pnpm --filter @football-predictor/web exec next start -p 3001 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/api/health/live >/dev/null 2>&1; then break; fi
            sleep 2
          done
          node scripts/perf-smoke.mjs http://127.0.0.1:3001 || echo "perf smoke reported issues (non-blocking)"
          kill "$SERVER_PID" 2>/dev/null || true
