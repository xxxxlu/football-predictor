name: ci

on:
  pull_request:
  push:
    # Release branches must be covered, not just main: the 2026-07-25 releases were
    # pushed straight to feature/pulse-football-f1 with no pull request, so all three
    # production deploys shipped without CI — and the e2e suite was red at the time.
    branches: [main, 'feature/**', 'release/**']

permissions:
  contents: read

jobs:
  audit:
    # NFR21 (dependency slice): lockfile vulnerability scan against the npm advisory DB.
    # High/critical advisories BLOCK; the first step logs every known advisory (any severity)
    # for visibility without failing. SAST/secrets are covered by the security job below;
    # DAST needs a running environment and remains a documented gap.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Report all known advisories (non-blocking, any severity)
        run: pnpm audit || echo "::warning::pnpm audit found advisories below the blocking threshold (see log)"
      - name: Fail on high or critical advisories (blocking)
        run: pnpm audit --audit-level high

  security:
    # NFR21 (SAST/secrets slice). gitleaks scans the FULL git history for committed
    # secrets — a secret deleted in a later commit is still published by the commit
    # that added it, so a working-tree scan would miss the thing that matters most.
    # Allowlisting lives in .gitleaks.toml + .gitleaksignore and covers exactly the
    # audited throwaway e2e password, pinned by commit:path:rule:line.
    #
    # Semgrep runs the p/default ruleset twice: a full report at every severity for
    # visibility (non-blocking), and an ERROR-severity gate that blocks. Verified
    # against this tree before landing — gitleaks 186 commits/0 leaks, semgrep
    # 173 rules over 747 files/0 findings — so the gate starts green rather than
    # being merged red and muted.
    #
    # DAST needs a running environment and remains a documented gap.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks needs the full history, not a shallow clone
      - name: Install pinned scanners (gitleaks binary checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          pipx install semgrep==1.170.1
      - name: Secret scan over full git history (blocking)
        run: gitleaks git . --redact
      - name: Semgrep report (non-blocking, all severities)
        run: semgrep scan --config p/default --metrics=off || echo "::warning::semgrep found findings below the blocking threshold (see log)"
      - name: Semgrep gate on ERROR-severity findings (blocking)
        run: semgrep scan --config p/default --metrics=off --severity ERROR --error

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_ci
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_VERSION: ci
      LOG_LEVEL: info
      RULES_VERSION: phase-1-ci
      DATABASE_URL: postgresql://pulse:pulse_ci@127.0.0.1:5432/pulse_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify workspace and deployment blueprint structure
        run: pnpm verify:workspace
      - name: Migration smoke and idempotency
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm --filter @pulse/db exec node --input-type=module -e '
            import { readdir } from "node:fs/promises";
            import postgres from "postgres";
            const expected = (await readdir("migrations")).filter((name) => name.endsWith(".sql")).length;
            const sql = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
            const [{ count }] = await sql`SELECT count(*)::int AS count FROM public.app_schema_migrations`;
            await sql.end();
            if (count !== expected) throw new Error(`migration smoke mismatch: expected ${expected}, got ${count}`);
            console.log(`migration smoke passed: ${count} migrations, second run idempotent`);
          '
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Story 7.5 gates G1/G2/G5: main-journey Playwright E2E + axe a11y scan + perf smoke.
    # BLOCKING release gate. The session cookie's Secure flag now keys on APP_ENV (=test here), so the
    # authenticated journeys (invite/join, closing race, host operations, super admin, F1 axe, F1
    # prediction rules: combination pricing / one bet per market / retired markets) run for
    # real against the production build — no test.fixme placeholders remain.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_ci
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_VERSION: ci
      LOG_LEVEL: info
      RULES_VERSION: phase-1-ci
      DATABASE_URL: postgresql://pulse:pulse_ci@127.0.0.1:5432/pulse_test
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      # Throwaway credentials for this job's disposable database only — never used outside CI.
      # The seed script and the super-admin journey (super-admin-exception.spec.ts) read the same values.
      SUPER_ADMIN_1_USERNAME: ci_admin_one
      SUPER_ADMIN_1_PASSWORD: Ci-Admin-One-2026!e2e
      SUPER_ADMIN_2_USERNAME: ci_admin_two
      SUPER_ADMIN_2_PASSWORD: Ci-Admin-Two-2026!e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Seed super-admins for the admin journey (blocking — journey 5 depends on it)
        run: pnpm db:seed:super-admins
      - name: Build packages, worker and web
        run: pnpm build
      # Seeds run after the build: the F1 seed imports pricing from the built domain package.
      - name: Seed F1 2026 data (F1 axe suite + submission wall)
        run: pnpm db:seed:f1-2026
      - name: Seed the e2e football fixture (closing-race journey)
        run: pnpm db:seed:e2e
      - name: Install Playwright browser (chromium)
        run: pnpm --filter @pulse/web exec playwright install --with-deps chromium
      - name: Run main-journey E2E and axe accessibility scan
        run: pnpm --filter @pulse/web test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Performance smoke (blocking tripwire)
        # if: always() so a failing E2E step still produces perf-smoke output for diagnosis instead of
        # skipping it. BLOCKING since 7.3a wrapped: exceeding the (deliberately generous) p95 ceiling or
        # an erroring endpoint fails the job. Still a smoke tripwire, not an NFR1/NFR4 load assertion —
        # those remain documented gaps.
        if: always()
        run: |
          pnpm --filter @pulse/web exec next start -p 3001 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/api/health/live >/dev/null 2>&1; then break; fi
            sleep 2
          done
          STATUS=0
          node scripts/perf-smoke.mjs http://127.0.0.1:3001 || STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit "$STATUS"
