name: supplier-sync

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce scheduled-run congestion.
    # The database lease allows at most one World Cup odds credit per run window.
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: supplier-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply idempotent database migrations
        run: pnpm db:migrate
      - name: Refresh current World Cup fixtures, results, and real 1X2 odds
        run: pnpm supplier:current-world-cup
